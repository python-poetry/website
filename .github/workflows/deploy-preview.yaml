name: "Deploy Preview"

# Exactly one of the two triggers passes the deploy job's condition:
# - PRs from branches of this repository run via pull_request, so maintainers
#   can modify and test this workflow. No label is required.
# - PRs from forks run via pull_request_target (which uses the workflow from the
#   base branch) and only when labeled as safe.
on:
  pull_request:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - labeled
      - synchronize

permissions: {}

jobs:
  deploy-preview:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
          && contains(github.event.pull_request.labels.*.name, 'safe'))
    # Cancel stale runs so that an older run cannot deploy or update the comment
    # after a newer one. This is defined on the job (not the workflow) so that
    # runs whose job is skipped by the condition above do not cancel others.
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: Preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build Assets
        run: npm ci && npm run prod

      - name: Fetch Documentation
        run: |
          python -m pip install poetry
          poetry install --no-root --only main
          poetry run python bin/website build

      - name: Build
        run: npx hugo --buildDrafts --buildFuture --logLevel info

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        id: deploy
        with:
          wranglerVersion: "4.152.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=python-poetry --branch=pr-${{ github.event.pull_request.number }} --commit-hash=${{ github.event.pull_request.head.sha }} --commit-dirty=true

      - name: Comment Preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$(cat <<BODY
          Deploy preview for ${HEAD_SHA}:

          - Latest: ${ALIAS_URL:-$DEPLOYMENT_URL}
          - This commit: ${DEPLOYMENT_URL}
          BODY
          )"
